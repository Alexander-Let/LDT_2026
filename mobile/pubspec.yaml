name: finni_app
description: "Питомец Финни — игра по финансовой грамотности для детей 7–11 лет (ЛЦТ 2026)."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  sqflite: ^2.4.1
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/bundle.json
    - assets/pet/
    - assets/bg/
    - assets/shop/
    - assets/icons/
  fonts:
    - family: Jersey10
      fonts:
        - asset: assets/fonts/Jersey10-Regular.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
